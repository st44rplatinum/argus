# Local PACS. Nothing here is exposed beyond localhost: bind addresses are
# explicit so a stray firewall rule cannot publish patient data by accident.
services:
  orthanc:
    image: orthancteam/orthanc:25.6.2
    container_name: radviewer-orthanc
    restart: unless-stopped
    ports:
      - "127.0.0.1:8042:8042"   # HTTP / REST / DICOMweb
      - "127.0.0.1:4242:4242"   # DICOM protocol, for C-STORE from tooling
    volumes:
      - ./orthanc-db:/var/lib/orthanc/db
    environment:
      ORTHANC__NAME: radviewer
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: /dicom-web/
      # No CORS, deliberately. The browser never talks to Orthanc: OHIF's dev
      # server proxies /pacs/dicom-web to it, so everything is same-origin.
      #
      # This matters. An earlier version of this file allowed origin "*" with
      # authentication off, which would let any page the user happens to visit
      # read studies out of this container. The proxy removes the need for
      # CORS, so the wildcard goes rather than being narrowed.
      #
      # Authentication stays off because the 127.0.0.1 bind above is the
      # property that makes this safe, and a password would have to live in
      # the proxy config to be useful. Re-enable both together if the bind
      # ever changes.
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      # Studies arrive from many sources with inconsistent transfer syntaxes.
      ORTHANC__UNKNOWN_SOP_CLASS_ACCEPTED: "true"
      ORTHANC__STABLE_AGE: "10"
